<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Agenda Deluxe</title>
<meta name="theme-color" content="#faf7f2">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
  .wrap { max-width: 900px; }
  .kpis { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .prof { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .prof .info span { display: inline-block; margin-right: 12px; }
  #busca { margin-bottom: 12px; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="marca" style="font-size:1.15rem">Agenda <b>Deluxe</b> · Admin</div>
  <a class="btn btn-line btn-sm" href="./">Voltar ao app</a>
</div></header>

<div class="wrap">
  <div id="msg" class="vazio">Carregando…</div>
  <div id="conteudo" class="hide">
    <div class="kpis" id="kpis"></div>
    <div class="row between" style="margin:18px 0 8px">
      <h2 style="margin:0">Profissionais</h2>
      <span class="muted" id="contagem"></span>
    </div>
    <input id="busca" placeholder="Buscar por nome, e-mail ou link…">
    <div id="lista"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let dados = null;

async function carregar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("msg").innerHTML = `Faça login no app primeiro.<br><br><a class="btn" href="./">Ir para o login</a>`; return; }
  const { data, error } = await sb.rpc("ad_admin_painel");
  if (error) { $("msg").textContent = error.message.includes("restrito") ? "Acesso restrito ao administrador." : "Erro: " + error.message; return; }
  dados = data;
  $("msg").classList.add("hide"); $("conteudo").classList.remove("hide");
  const t = data.totais;
  const taxa = t.atendidos + t.faltas ? Math.round((t.faltas / (t.atendidos + t.faltas)) * 100) : 0;
  $("kpis").innerHTML = [
    ["Profissionais", t.profissionais, `${t.novos_7d} nos últimos 7 dias`],
    ["Agendamentos", t.agendamentos, `${t.agendamentos_30d} nos últimos 30 dias`],
    ["Atendidos", t.atendidos, "marcados como atendido"],
    ["Faltas", t.faltas, `${taxa}% dos atendimentos`],
    ["Confirmados", t.confirmados_pelo_cliente, "pelo link do lembrete"],
  ].map(([n, v, d]) => `<div class="kpi"><small>${n}</small><b>${v}</b><small>${d}</small></div>`).join("");
  desenha();
}

function desenha() {
  const q = $("busca").value.toLowerCase().trim();
  const lista = dados.profissionais.filter((p) => !q || [p.nome, p.email, p.slug, p.profissao].join(" ").toLowerCase().includes(q));
  $("contagem").textContent = `${lista.length} de ${dados.profissionais.length}`;
  $("lista").innerHTML = lista.length ? lista.map((p) => `
    <div class="card prof" style="${p.pausado ? "opacity:.6" : ""}">
      <div class="info">
        <b>${AD.esc(p.nome)}</b> ${p.pausado ? '<span class="badge cancelado">Pausado</span>' : ""}
        <div class="muted">${AD.esc(p.profissao || "—")} · ${AD.esc(p.email)}</div>
        <div class="muted" style="margin-top:4px">
          <span>📅 desde ${AD.dataCurta(p.criado_em)}</span>
          <span>✂️ ${p.servicos} serviço(s)</span>
          <span>🗓️ ${p.agendamentos} agendamento(s)</span>
          <span>${p.ultimo_agendamento ? "último em " + AD.dataCurta(p.ultimo_agendamento) : "nenhum agendamento ainda"}</span>
        </div>
      </div>
      <div class="stack" style="min-width:130px">
        <a class="btn btn-line btn-sm" target="_blank" rel="noopener" href="agendar.html?u=${encodeURIComponent(p.slug)}">Ver link</a>
        ${p.whatsapp ? `<a class="btn btn-zap btn-sm" target="_blank" rel="noopener" href="https://wa.me/${AD.zap(p.whatsapp)}">WhatsApp</a>` : ""}
        <button class="btn-line btn-sm" data-id="${p.id}" data-p="${p.pausado ? 0 : 1}" style="color:${p.pausado ? "var(--ok)" : "var(--bad)"}">${p.pausado ? "Reativar" : "Pausar"}</button>
      </div>
    </div>`).join("") : `<div class="vazio">Nenhum profissional encontrado.</div>`;
  $("lista").querySelectorAll("button[data-id]").forEach((b) => (b.onclick = async () => {
    const pausar = b.dataset.p === "1";
    if (pausar && !confirm("Pausar esta conta? O painel e o link de agendamento dela param de funcionar até você reativar.")) return;
    const { error } = await sb.rpc("ad_admin_pausar", { p_id: b.dataset.id, p_pausado: pausar });
    if (error) return AD.toast(error.message, 1);
    AD.toast(pausar ? "Conta pausada." : "Conta reativada.");
    carregar();
  }));
}
$("busca").oninput = () => dados && desenha();
carregar();
</script>
</body>
</html>
