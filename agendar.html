<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendar horário</title>
<meta name="theme-color" content="#A3AB97">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap" style="padding-bottom:40px">
  <div class="hero" style="padding-top:28px">
    <h1 id="nome">Carregando…</h1>
    <p class="muted" id="prof"></p>
  </div>

  <div id="passos">
    <div class="card stack">
      <h3>1. Escolha o serviço</h3>
      <div id="servicos" class="stack"></div>
    </div>

    <div class="card stack hide" id="box-dia">
      <h3>2. Escolha o dia</h3>
      <div class="dias" id="dias"></div>
      <h3 style="margin-top:14px">3. Escolha o horário</h3>
      <div id="slots" class="slots"></div>
    </div>

    <div class="card stack hide" id="box-dados">
      <h3>4. Seus dados</h3>
      <div><label>Seu nome</label><input id="c-nome" autocomplete="name" placeholder="Nome e sobrenome"></div>
      <div><label>Seu WhatsApp (com DDD)</label><input id="c-zap" inputmode="tel" autocomplete="tel" placeholder="11 98765-4321"></div>
      <div class="card" style="background:#faf7f2;box-shadow:none;margin:0" id="resumo"></div>
      <button class="btn-gold btn-full" id="confirmar">Confirmar agendamento</button>
    </div>
  </div>

  <div class="card hide" id="sucesso" style="text-align:center">
    <div style="font-size:3rem">🎉</div>
    <h2>Horário marcado!</h2>
    <p id="suc-txt"></p>
    <p class="muted">Você vai receber um lembrete no WhatsApp antes do horário.</p>
    <a class="btn btn-zap btn-full" id="suc-zap" target="_blank" rel="noopener">Avisar no WhatsApp</a>
  </div>

  <p class="muted" style="text-align:center;margin-top:24px">Agendamento por <span class="marca">Agenda <b>Deluxe</b></span></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const slug = new URLSearchParams(location.search).get("u") || "";
const SEM = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const st = { pag: null, serv: null, dia: null, hora: null };

async function carregar() {
  const { data, error } = await sb.rpc("ad_pagina_publica", { p_slug: slug });
  if (error || !data) { $("nome").textContent = "Página não encontrada"; $("passos").classList.add("hide"); return; }
  st.pag = data;
  document.title = "Agendar com " + data.nome;
  $("nome").textContent = data.nome;
  $("prof").textContent = data.profissao || "";
  if (data.liberado === false) {
    $("passos").innerHTML = `<div class="card" style="text-align:center"><h3>Agenda indisponível no momento</h3>
      <p class="muted">Os agendamentos online estão pausados.${data.whatsapp ? " Fale direto pelo WhatsApp:" : ""}</p>
      ${data.whatsapp ? `<a class="btn btn-zap btn-full" target="_blank" rel="noopener" href="https://wa.me/${AD.zap(data.whatsapp)}">Chamar no WhatsApp</a>` : ""}</div>`;
    return;
  }
  $("servicos").innerHTML = data.servicos.length
    ? data.servicos.map((s) => `<button class="serv" data-id="${s.id}"><span>${AD.esc(s.nome)}<br><small class="muted">${s.duracao_min < 60 ? s.duracao_min + " min" : (s.duracao_min / 60).toString().replace(".", ",") + "h"}</small></span><b>${AD.brl(s.preco)}</b></button>`).join("")
    : `<p class="muted">Ainda não há serviços disponíveis.</p>`;
  $("servicos").querySelectorAll(".serv").forEach((b) => (b.onclick = () => {
    st.serv = data.servicos.find((s) => s.id === b.dataset.id); st.hora = null;
    $("servicos").querySelectorAll(".serv").forEach((x) => x.classList.toggle("on", x === b));
    $("box-dia").classList.remove("hide"); $("box-dados").classList.add("hide");
    desenhaDias();
    $("box-dia").scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

function desenhaDias() {
  const hoje = AD.isoDia();
  const dias = Array.from({ length: 30 }, (_, i) => AD.somaDias(hoje, i));
  if (!st.dia || !st.pag.dias.includes(new Date(st.dia + "T12:00:00Z").getUTCDay()))
    st.dia = dias.find((d) => st.pag.dias.includes(new Date(d + "T12:00:00Z").getUTCDay())) || hoje;
  $("dias").innerHTML = dias.map((d) => {
    const dt = new Date(d + "T12:00:00Z"), aberto = st.pag.dias.includes(dt.getUTCDay());
    return `<button data-d="${d}" class="${d === st.dia ? "on" : ""}" ${aberto ? "" : "disabled"}><small>${d === hoje ? "Hoje" : SEM[dt.getUTCDay()]}</small><b>${dt.getUTCDate()}</b><small>${dt.toLocaleDateString("pt-BR", { month: "short", timeZone: "UTC" }).replace(".", "")}</small></button>`;
  }).join("");
  $("dias").querySelectorAll("button").forEach((b) => (b.onclick = () => { st.dia = b.dataset.d; st.hora = null; desenhaDias(); }));
  carregaSlots();
}

async function carregaSlots() {
  $("slots").innerHTML = `<p class="muted">Buscando horários…</p>`;
  const { data, error } = await sb.rpc("ad_horarios_livres", { p_slug: slug, p_servico: st.serv.id, p_data: st.dia });
  if (error) { $("slots").innerHTML = `<p class="muted">Erro ao buscar horários. Tente de novo.</p>`; return; }
  $("slots").innerHTML = data.length
    ? data.map((t) => `<button data-t="${t}">${AD.hora(t)}</button>`).join("")
    : `<p class="muted" style="grid-column:1/-1">Sem horários livres neste dia. Escolha outro dia.</p>`;
  $("slots").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    st.hora = b.dataset.t;
    $("slots").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    $("resumo").innerHTML = `<b>${AD.esc(st.serv.nome)}</b> · ${AD.brl(st.serv.preco)}<br><span>${AD.dataLonga(st.hora)}</span> às <b>${AD.hora(st.hora)}</b>`;
    $("box-dados").classList.remove("hide");
    $("box-dados").scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

try { const c = JSON.parse(localStorage.getItem("ad_cliente") || "{}"); $("c-nome").value = c.nome || ""; $("c-zap").value = c.zap || ""; } catch {}

$("confirmar").onclick = async () => {
  const nome = $("c-nome").value.trim(), zap = $("c-zap").value.replace(/\D/g, "");
  if (nome.length < 2) return AD.toast("Informe seu nome.", 1);
  if (zap.length < 10 || zap.length > 13) return AD.toast("Informe o WhatsApp com DDD.", 1);
  $("confirmar").disabled = true;
  const { data: id, error } = await sb.rpc("ad_agendar", { p_slug: slug, p_servico: st.serv.id, p_inicio: st.hora, p_nome: nome, p_whatsapp: zap });
  $("confirmar").disabled = false;
  if (error) { AD.toast(error.message.includes("disponível") ? "Ops, alguém acabou de pegar esse horário. Escolha outro." : AD.erro(error), 1); return carregaSlots(); }
  try { localStorage.setItem("ad_cliente", JSON.stringify({ nome, zap })); } catch {}
  $("passos").classList.add("hide");
  $("sucesso").classList.remove("hide");
  const quando = `${AD.dataLonga(st.hora)} às ${AD.hora(st.hora)}`;
  $("suc-txt").innerHTML = `<b>${AD.esc(st.serv.nome)}</b> com ${AD.esc(st.pag.nome)}<br><span>${quando}</span>`;
  if (st.pag.whatsapp) $("suc-zap").href = `https://wa.me/${AD.zap(st.pag.whatsapp)}?text=${encodeURIComponent(`Oi! Acabei de agendar ${st.serv.nome} para ${quando} pelo seu link. Meu nome é ${nome}.`)}`;
  else $("suc-zap").classList.add("hide");
  scrollTo(0, 0);
};

carregar();
</script>
</body>
</html>
